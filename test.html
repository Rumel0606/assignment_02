<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .podcast-hero {
    position: relative;
    /* other styles for layout, background color, padding */
}

.podcast-image-container {
    position: relative; /* This is key for positioning the badge inside */
    width: 200px; /* Example size */
    height: 200px; /* Example size, needs to be same as width for a perfect circle */
    border-radius: 50%;
    /* other styles like background gradient */
}

.podcast-mic-icon {
    width: 100%;
    height: 100%;
    border-radius: 50%; /* Makes the image fully circular */
}

.badge {
    position: absolute;
    top: 10px; /* Adjust as needed */
    right: -20px; /* Adjust as needed */
    background: #00FF88; /* Example color */
    color: #2A186C;
    padding: 5px 10px;
    border-radius: 20px; /* Rounded badge */
    font-weight: bold;
}
    </style>
    <title>Document</title>
</head>
<body>
     <section class="podcast-hero">
    <!-- Background element goes here (can be a wave SVG or CSS waves) -->
    <div class="background-wave"></div>

    <div class="content-container">
        <div class="podcast-image-container">
            <!-- The circular image/icon with badge -->
            <img src="microphone-icon.svg" alt="Podcast Microphone" class="podcast-mic-icon">
            <span class="badge">NEW</span>
        </div>
        
        <h1>TechWave</h1>
        <p>Your daily dose of tech insights...</p>
        <a href="#" class="listen-button">Listen On Spotify</a>
    </div>
</section>
</body>
</html>
